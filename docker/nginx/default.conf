# Matches the base domain and any provider subdomain (*.platform.test).
server {
    listen 80;
    server_name platform.test *.platform.test localhost;
    root /var/www/html/public;
    index index.php;

    # Vite dev server (HMR) is reached on :5173 directly in local dev.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
