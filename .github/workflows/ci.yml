name: CI
on: [push, pull_request]
jobs:
    api:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: billing_test
                    POSTGRES_USER: billing
                    POSTGRES_PASSWORD: secret
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U billing"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with: { php-version: '8.4', coverage: none, extensions: pdo_pgsql }
            - run: composer install --no-interaction --prefer-dist
            - run: cp .env.example .env && php artisan key:generate && php artisan jwt:secret --force
            - run: ./vendor/bin/pint --test
            - name: Pest (sqlite in-memory)
              run: ./vendor/bin/pest
            - name: Pest (PostgreSQL 16)
              run: ./vendor/bin/pest
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: '5432'
                  DB_DATABASE: billing_test
                  DB_USERNAME: billing
                  DB_PASSWORD: secret
    web:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: 24 }
            - run: npm ci
            - run: npm run lint
            - run: npm run typecheck
            - run: npm test
            - run: npm run build
