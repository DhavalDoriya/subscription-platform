name: billing-platform

x-app: &app
    build: { context: ., dockerfile: docker/php/Dockerfile }
    volumes: [".:/var/www/html"]
    env_file: .env
    depends_on: [postgres, redis]

services:
    app:
        <<: *app
    nginx:
        image: nginx:1.27-alpine
        ports: ["80:80"]
        volumes: [".:/var/www/html:ro", "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
        depends_on: [app]
    node:
        image: node:24-alpine
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev"
        ports: ["5173:5173"]
        volumes: [".:/var/www/html"]
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: billing
            POSTGRES_USER: billing
            POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        volumes: ["pgdata:/var/lib/postgresql/data"]
    redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    horizon:
        <<: *app
        command: php artisan horizon
    scheduler:
        <<: *app
        command: php artisan schedule:work
    mailpit:
        image: axllent/mailpit
        ports: ["8025:8025", "1025:1025"]
    minio:
        image: minio/minio
        command: server /data --console-address ":9001"
        environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
        ports: ["9000:9000", "9001:9001"]
        volumes: ["miniodata:/data"]
    stripe-cli:
        image: stripe/stripe-cli
        profiles: ["stripe"]
        command: listen --api-key ${STRIPE_SECRET} --forward-to http://nginx/api/v1/webhooks/stripe
        depends_on: [nginx]

volumes:
    pgdata:
    miniodata:
